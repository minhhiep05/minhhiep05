name: Generate trophy card

on:
  schedule:
    # Execute every 12 hours at minute 0
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate trophy.svg
        uses: ryo-ma/github-profile-trophy@master
        with:
          USERNAME: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_TYPE: svg
          SAVE_NAME: dist/trophy.svg
          THEME: tokyonight
          MAX_ROWS: 1
          MARGIN_WIDTH: 8
          MARGIN_HEIGHT: 8
          NO_BACKGROUND: true
          NO_FRAME: true

      - name: Push trophy.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: trophy-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
